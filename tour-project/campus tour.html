<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Virtual Campus Tour | VIT Bhopal University</title>
    <meta
      name="description"
      content="Explore the VIT Bhopal University campus in an interactive 360° virtual tour."
    />
    <meta name="theme-color" content="#0b2a5b" />

    </svg>

    <!-- Top bar -->
    <header class="topbar">
      <button
        class="topbar-btn"
        id="menuBtn"
        type="button"
        aria-label="Open locations menu"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        <svg class="icon"><use href="#i-menu" /></svg>
        <span>Locations</span>
      </button>
      <div class="brand">
        <img
          src="../logo/Vit Bhopal Logo.png"
          alt="VIT Bhopal University"
          height="36"
        />
        <span class="brand-text">Virtual Campus Tour</span>
      </div>
    </header>

    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar" aria-label="Campus locations">
      <div class="sidebar-header">
        <h2>Campus <span class="highlight">Locations</span></h2>
        <button
          class="close-btn"
          id="closeBtn"
          type="button"
          aria-label="Close locations menu"

          <svg class="icon"><use href="#i-close" /></svg>
        </button>
      </div>

      <div class="menu">
        <button class="menu-item" type="button" data-scene="exit 1" style="--bg: url('thumbs/main-entrance.jpg')">

        </button>

        <button class="menu-item" type="button" data-scene="ab 15" style="--bg: url('thumbs/food-court.jpg')">

    </nav>

    <!-- Bottom toolbar -->
    <div class="bottom-toolbar" role="toolbar" aria-label="Tour controls">
      <button id="btnLeft" class="pan" type="button" aria-label="Look left"><svg class="icon"><use href="#i-left" /></svg></button>
      <button id="btnRight" class="pan" type="button" aria-label="Look right"><svg class="icon"><use href="#i-right" /></svg></button>
      <button id="btnUp" class="pan" type="button" aria-label="Look up"><svg class="icon"><use href="#i-up" /></svg></button>
      <button id="btnDown" class="pan" type="button" aria-label="Look down"><svg class="icon"><use href="#i-down" /></svg></button>
      <span class="divider pan" aria-hidden="true"></span>
      <button data-action="zoom-in" type="button" aria-label="Zoom in" title="Zoom in"><svg class="icon"><use href="#i-plus" /></svg></button>
      <button data-action="zoom-out" type="button" aria-label="Zoom out" title="Zoom out"><svg class="icon"><use href="#i-minus" /></svg></button>
      <button data-action="fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen"><svg class="icon"><use href="#i-full" /></svg></button>
      <span class="divider" aria-hidden="true"></span>
      <button data-scene="exit 2" type="button" aria-label="Go to main gate" title="Main gate"><svg class="icon"><use href="#i-start" /></svg></button>

      <a href="https://vitbhopal.ac.in/" target="_blank" rel="noopener" class="tb-link" aria-label="Visit VIT Bhopal website" title="VIT Bhopal website"><svg class="icon"><use href="#i-globe" /></svg></a>

                                scene-names.js replaces titles/labels with

                                scenes and removes the green on a <canvas>.

            if (hs.type === "scene" && hs.sceneId) {
              let targetScene = tourConfig.scenes[hs.sceneId];
              if (targetScene && targetScene.hotSpots) {
                let rev = targetScene.hotSpots.find(
                  (s) => s.type === "scene" && s.sceneId === sceneKey,
                );
                if (
                  rev &&
                  rev.yaw !== undefined &&
                  hs.targetYaw === undefined
                ) {
                  let y = rev.yaw + 180;

      function setOptimalCanvasSize() {
        if (!activeVideo || !activeVideo.videoWidth) return;

        let vw = activeVideo.videoWidth;
        let vh = activeVideo.videoHeight;
        // Smaller keying canvas on phones keeps playback smooth
        const MAX_WIDTH = window.innerWidth < 700 ? 360 : 640;

        if (vw > MAX_WIDTH) {
          const scale = MAX_WIDTH / vw;
          vw = MAX_WIDTH;
          vh = Math.floor(vh * scale);
        }

        chromaCanvas.width = vw;
        chromaCanvas.height = vh;
      }

      function updateCanvasSize(e) {
        if (activeVideo && activeVideo === e.target) {
          setOptimalCanvasSize();

        "ab front gate 1",
        "ab front gate 2",
      ];

      const mphScenes = ["mph 1", "mph 2", "mph 3", "mph 4", "lion park"];

      const lcScenes = [
        "lc 1",
        "lc 2",
        "lc 3",
        "lc 4",
        "lc 5",
        "arch 1",
        "arch 2",
      ];

      const ab2Scenes = [
        "ab2  2",
        "ab2  3",
        "ab2  4",
        "ab2  5",
        "ab2  6",
        "ab2  7",
        "ab2  8",
        "ab 2 gate 9",
      ];

      function playVideoIfReady() {
        const currentScene = viewer.getScene();

        let targetVideo = null;
        let shouldPlay = false;

        if (currentScene === "exit 1" && !hasExit1PlayedOnce) {
          targetVideo = videoElement;
          shouldPlay = true;
        } else if (amanScenes.includes(currentScene) && !hasAmanPlayedOnce) {
          targetVideo = amanVideo;
          shouldPlay = true;
        } else if (mphScenes.includes(currentScene) && !hasMphPlayedOnce) {
          targetVideo = mphVideo;
          shouldPlay = true;
        } else if (lcScenes.includes(currentScene) && !hasLcPlayedOnce) {
          targetVideo = lcVideo;
          shouldPlay = true;
        } else if (ab2Scenes.includes(currentScene) && !hasAb2PlayedOnce) {
          targetVideo = ab2Video;
          shouldPlay = true;
        }

        if (shouldPlay && targetVideo) {
          activeVideo = targetVideo;
          // Always ensure optimal size before playing to prevent extreme lag
          setOptimalCanvasSize();

          chromaCanvas.style.display = "block";
          const playPromise = activeVideo.play();
          if (playPromise !== undefined) {
            playPromise
              .then(() => {
                if (activeVideo === videoElement) hasExit1PlayedOnce = true;
                if (activeVideo === amanVideo) hasAmanPlayedOnce = true;
                if (activeVideo === mphVideo) hasMphPlayedOnce = true;
                if (activeVideo === lcVideo) hasLcPlayedOnce = true;
                if (activeVideo === ab2Video) hasAb2PlayedOnce = true;
                videoPlaying = true;
                startChromaKeyRendering();
              })
              .catch((e) => {
                console.warn(
                  "Autoplay with audio blocked. Waiting for user interaction to play video.",
                );
                const startOnInteract = () => {
                  if (activeVideo && viewer.getScene() === currentScene) {
                    activeVideo
                      .play()
                      .then(() => {
                        if (activeVideo === videoElement)
                          hasExit1PlayedOnce = true;
                        if (activeVideo === amanVideo) hasAmanPlayedOnce = true;
                        if (activeVideo === mphVideo) hasMphPlayedOnce = true;
                        if (activeVideo === lcVideo) hasLcPlayedOnce = true;
                        if (activeVideo === ab2Video) hasAb2PlayedOnce = true;
                        videoPlaying = true;
                        startChromaKeyRendering();
                      })
                      .catch((err) => console.error(err));
                  }
                  document.removeEventListener("click", startOnInteract);
                  document.removeEventListener("touchstart", startOnInteract);
                };
                document.addEventListener("click", startOnInteract);
                document.addEventListener("touchstart", startOnInteract);
              });
          } else {
            if (activeVideo === videoElement) hasExit1PlayedOnce = true;
            if (activeVideo === amanVideo) hasAmanPlayedOnce = true;
            if (activeVideo === mphVideo) hasMphPlayedOnce = true;
            if (activeVideo === lcVideo) hasLcPlayedOnce = true;
            if (activeVideo === ab2Video) hasAb2PlayedOnce = true;
            videoPlaying = true;
            startChromaKeyRendering();
          }
        }
      }

      // Listen for scene change to trigger video play or stop
      viewer.on("scenechange", function (e) {
        const currentScene = viewer.getScene();
        const inExit1 = currentScene === "exit 1";
        const inAmanScene = amanScenes.includes(currentScene);
        const inMphScene = mphScenes.includes(currentScene);
        const inLcScene = lcScenes.includes(currentScene);
        const inAb2Scene = ab2Scenes.includes(currentScene);

        // Stop active video if it doesn't belong to the current scene
        if (activeVideo) {
          const videoDoesNotBelong =
            (activeVideo === videoElement && !inExit1) ||
            (activeVideo === amanVideo && !inAmanScene) ||
            (activeVideo === mphVideo && !inMphScene) ||
            (activeVideo === lcVideo && !inLcScene) ||
            (activeVideo === ab2Video && !inAb2Scene);

          if (videoDoesNotBelong) {
            activeVideo.pause();
            activeVideo.currentTime = 0; // optional: reset to start
            activeVideo = null;
            videoPlaying = false;
            chromaCanvas.style.display = "none";
          }
        }

        playVideoIfReady();
      });

      viewer.on("load", playVideoIfReady);
      setTimeout(playVideoIfReady, 500);

      function startChromaKeyRendering() {
        function renderFrame() {
          if (
            !videoPlaying ||
            !activeVideo ||
            activeVideo.paused ||
            activeVideo.ended
          ) {
            if (activeVideo && activeVideo.ended) {
              chromaCanvas.style.display = "none";
              activeVideo = null;
            }
            return;
          }

          // Crop a few pixels from the top/bottom/sides to remove any baked-in video borders or letterboxing
          const cropX = 10;
          const cropY = 15;
          const drawWidth = activeVideo.videoWidth - cropX * 2;
          const drawHeight = activeVideo.videoHeight - cropY * 2;

          if (drawWidth > 0 && drawHeight > 0) {
            ctx.clearRect(0, 0, chromaCanvas.width, chromaCanvas.height);
            ctx.drawImage(
              activeVideo,
              cropX,
              cropY,
              drawWidth,
              drawHeight,
              0,
              0,
              chromaCanvas.width,
              chromaCanvas.height,
            );
          } else {
            ctx.drawImage(
              activeVideo,
              0,
              0,
              chromaCanvas.width,
              chromaCanvas.height,
            );
          }

          const imageData = ctx.getImageData(
            0,
            0,
            chromaCanvas.width,
            chromaCanvas.height,
          );
          const data = imageData.data;

          // Apply chroma key - make green transparent
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            const maxRB = Math.max(r, b);
            if (g > maxRB + 20 && g > 70) {
              const dominance = g - maxRB;
              if (dominance > 45) {
                data[i + 3] = 0; // Fully transparent
              } else {
                // Partial transparency for edge smoothing
                data[i + 3] = Math.max(
                  0,
                  parseInt(255 - (dominance - 20) * 10),
                );
              }
            }
          }

          ctx.putImageData(imageData, 0, 0);

          requestAnimationFrame(renderFrame);
        }

        requestAnimationFrame(renderFrame);
      }

      videoElement.addEventListener("ended", function () {
        if (activeVideo === videoElement) {
          chromaCanvas.style.display = "none";
          videoPlaying = false;
          activeVideo = null;
        }
      });

      amanVideo.addEventListener("ended", function () {
        if (activeVideo === amanVideo) {
          chromaCanvas.style.display = "none";
          videoPlaying = false;
          activeVideo = null;
        }
      });

      mphVideo.addEventListener("ended", function () {
        if (activeVideo === mphVideo) {
          chromaCanvas.style.display = "none";
          videoPlaying = false;
          activeVideo = null;
        }
      });

      lcVideo.addEventListener("ended", function () {
        if (activeVideo === lcVideo) {
          chromaCanvas.style.display = "none";
          videoPlaying = false;
          activeVideo = null;
        }
      });

      ab2Video.addEventListener("ended", function () {
        if (activeVideo === ab2Video) {
          chromaCanvas.style.display = "none";
          videoPlaying = false;
          activeVideo = null;
        }
      });

      // END CHROMA KEY VIDEO EFFECT
    </script>
    <script src="script.js"></script>
  </body>
